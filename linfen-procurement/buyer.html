<!DOCTYPE html>
<html lang="zh-CN">

<link rel="stylesheet" href="assets/site.css">

<body>
<header class="lf-nav" data-lf-nav></header>

  <div id="ent-list-view">

      <input id="ent-filter" class="ent-filter" type="search" placeholder="输入采购单位名称筛选…" autocomplete="off">

</div>
