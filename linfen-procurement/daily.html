<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>临汾市政府采购专题站 · 每日新增</title>
<link rel="stylesheet" href="assets/site.css">
</head>
<body>
<header class="lf-nav" data-lf-nav></header>

<div class="wrap">
  <div class="hero">
    <h1>每日新增项目日志</h1>
    <p>按项目首次在政府采购网出现的日期与时间归档。每条均链接到对应的政府公告原文详情，可逐日回溯临汾全域采购动态。增量采集后，新项目会自动排到日志顶部。</p>
    <span class="tag" id="hero-tag">数据加载中…</span>
  </div>

  <div class="daily-toolbar">
    <input id="daily-search" class="daily-search" type="search"
           placeholder="搜索项目名 / 采购单位 / 中标供应商…" autocomplete="off">
    <span id="daily-stat" class="daily-stat"></span>
  </div>

  <div class="daily-layout">
    <aside class="daily-index" id="daily-index">
      <div class="daily-index-h">日期索引</div>
      <div id="daily-index-list" class="daily-index-list"></div>
    </aside>
    <section class="daily-main" id="daily-main">
      <div class="loading">正在加载日志…</div>
    </section>
  </div>

  <div class="foot" id="foot"></div>
</div>

<script src="data/overview.js"></script>
<script src="data/daily_log.js"></script>
<script src="assets/common.js"></script>
<script src="assets/daily.js"></script>
</body>
</html>
