<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>临汾市政府采购专题站 · 乙方数据透视</title>
<link rel="stylesheet" href="assets/site.css">
</head>
<body>
<header class="lf-nav" data-lf-nav></header>

<div class="wrap">
  <div class="section-title" style="margin-top:8px;">乙方（供应方）数据透视 <small>供应商中标与合同履约画像</small></div>
  <a class="entry-btn" href="supplier.html">← 返回乙方列表</a>

  <div id="kpis" class="kpis"></div>

  <div class="grid" style="grid-template-columns: 1fr 1fr;">
    <div class="card">
      <h3><span class="bar"></span>合同金额 Top 30 供应商</h3>
      <div id="c-amt"></div>
    </div>
    <div class="card">
      <h3><span class="bar"></span>合同数量 Top 20 供应商</h3>
      <div id="c-cnt"></div>
    </div>
    <div class="card">
      <h3><span class="bar"></span>各区县合同金额</h3>
      <div id="c-dist"></div>
    </div>
    <div class="card">
      <h3><span class="bar"></span>各年度合同金额</h3>
      <div id="c-year"></div>
    </div>
  </div>

  <div class="card" style="margin-top:18px;">
    <h3><span class="bar"></span>合同金额区间分布</h3>
    <div id="c-bucket" style="display:flex;justify-content:center;"></div>
  </div>

  <div class="card" style="margin-top:18px;">
    <h3><span class="bar"></span>Top 30 供应商明细 <small>点击供应商名查看其全部执行项目</small></h3>
    <div style="overflow:auto;">
      <table class="lf" id="sup-table">
        <thead><tr><th>排名</th><th>供应商</th><th class="num">合同总额</th><th class="num">合同数</th><th>主要服务区县</th><th>代表采购人</th></tr></thead>
        <tbody></tbody>
      </table>
    </div>
  </div>

  <div class="foot">数据来源：中国政府采购网·山西分网公开公告。本页聚合自含供应商与合同金额的合同类公告，按供应商名称归并，仅供参考。</div>
</div>

<script src="data/overview.js"></script>
<script src="data/supplier_stats.js"></script>
<script src="assets/common.js"></script>
<script src="assets/supplier_viz.js"></script>
</body>
</html>
