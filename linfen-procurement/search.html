<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>临汾市政府采购专题站 · 项目检索</title>
<link rel="stylesheet" href="assets/site.css">
</head>
<body>
<header class="lf-nav" data-lf-nav></header>

<div class="wrap">
  <div class="section-title" style="margin-top:8px;">项目检索 <small>按年份 / 区县 / 类型 / 方式 / 品目 / 金额筛选明细库</small></div>

  <div class="card">
    <div class="filters">
      <div class="field" style="grid-column: span 2;">
        <label>关键词（标题 / 采购人 / 供应商）</label>
        <input type="text" id="f-kw" placeholder="如：医院、道路、清扫…">
      </div>
      <div class="field">
        <label>年份</label>
        <select id="f-year"><option value="">全部</option></select>
      </div>
      <div class="field">
        <label>区县</label>
        <select id="f-dist"><option value="">全部</option></select>
      </div>
      <div class="field" style="position:relative;">
        <label>按单位（输入采购人名称，即时筛选）</label>
        <input type="text" id="f-buyer" placeholder="如：临汾市司法局" autocomplete="off">
        <div id="buyer-suggest" class="suggest" style="display:none;"></div>
      </div>
      <div class="field">
        <label>公告类型</label>
        <select id="f-type"><option value="">全部</option></select>
      </div>
      <div class="field">
        <label>采购方式</label>
        <select id="f-meth"><option value="">全部</option></select>
      </div>
      <div class="field">
        <label>品目</label>
        <select id="f-cat"><option value="">全部</option></select>
      </div>
      <div class="field">
        <label>金额下限（万元）</label>
        <input type="number" id="f-min" placeholder="0" min="0">
      </div>
      <div class="field">
        <label>金额上限（万元）</label>
        <input type="number" id="f-max" placeholder="不限" min="0">
      </div>
      <div class="field">
        <label>至少含金额</label>
        <select id="f-amt">
          <option value="">不限</option>
          <option value="budget">含预算</option>
          <option value="contract">含合同</option>
        </select>
      </div>
      <div class="field">
        <label>排序</label>
        <select id="f-sort">
          <option value="ts">发布时间（新→旧）</option>
          <option value="budget">预算（高→低）</option>
          <option value="contract">合同（高→低）</option>
        </select>
      </div>
    </div>
    <div class="toolbar">
      <button class="btn" id="btn-search">检索</button>
      <button class="btn ghost" id="btn-reset">重置</button>
      <span class="count-tip" id="count-tip"></span>
    </div>
  </div>

  <div class="card" style="margin-top:18px;">
    <table class="lf">
      <thead>
        <tr>
          <th style="width:34%;">公告标题</th>
          <th>区县</th><th>方式</th><th>品目</th>
          <th>采购人</th>
          <th class="num">预算</th><th class="num">合同</th>
          <th>发布时间</th><th></th>
        </tr>
      </thead>
      <tbody id="results"></tbody>
    </table>
    <div class="pager" id="pager"></div>
  </div>

  <div class="foot" id="foot"></div>
</div>

<script src="data/overview.js"></script>
<script src="data/rec-2023.js"></script>
<script src="data/rec-2024.js"></script>
<script src="data/rec-2025.js"></script>
<script src="data/rec-2026.js"></script>
<script src="assets/common.js"></script>
<script src="assets/search.js"></script>
</body>
</html>
